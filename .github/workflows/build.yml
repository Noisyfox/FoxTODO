name: Build FoxTODO

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            bundle: nsis
            output: src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-arm64
            runner: macos-15
            bundle: dmg
            output: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - run: rustup update stable --no-self-update
      - run: pnpm tauri build --ci --bundles ${{ matrix.bundle }}
      - name: Verify the app signature inside the macOS disk image
        if: runner.os == 'macOS'
        run: |
          mountpoint=$(mktemp -d "$RUNNER_TEMP/foxtodo-dmg.XXXXXX")
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" src-tauri/target/release/bundle/dmg/*.dmg
          trap 'hdiutil detach "$mountpoint"' EXIT
          codesign --verify --deep --strict --verbose=2 -R='identifier "io.noisyfox.foxtodo"' "$mountpoint/FoxTODO.app"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FoxTODO-${{ matrix.platform }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  android:
    name: Build Android ARM64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android build dependencies
        run: |
          rustup update stable --no-self-update
          rustup target add aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build unsigned release APK
        run: pnpm tauri android build --ci --target aarch64 --apk --config src-tauri/tauri.android.release.conf.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FoxTODO-android-arm64-unsigned
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*-unsigned.apk
          if-no-files-found: error

  sign-android:
    name: Sign Android release
    needs: android
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: android-release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: FoxTODO-android-arm64-unsigned
          path: unsigned
      - name: Sign APK and verify signer and Microsoft callback
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp "$RUNNER_TEMP/foxtodo-key.XXXXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=FoxTODO-android-arm64-release.apk
          "$tools/apksigner" sign --ks "$key" --ks-key-alias foxtodo --ks-pass env:KEYSTORE_PASSWORD --out "$apk" unsigned/*-unsigned.apk
          "$tools/zipalign" -c 4 "$apk"
          result=$("$tools/apksigner" verify --verbose --print-certs "$apk")
          printf '%s\n' "$result"
          sha1=$(sed -n 's/^Signer #1 certificate SHA-1 digest: //p' <<< "$result")
          [[ "$sha1" =~ ^[[:xdigit:]]{40}$ ]]
          signature=$(printf '%s' "$sha1" | xxd -r -p | openssl base64 -A)
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$apk" > "$RUNNER_TEMP/manifest.xml"
          python3 - "$RUNNER_TEMP/manifest.xml" "$signature" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          for intent in root.findall(".//activity/intent-filter"):
              data = [element.attrib for element in intent.findall("data")]
              if all(any(row.get(android + k) == v for row in data) for k, v in
                     [("scheme", "msauth"), ("host", "io.noisyfox.foxtodo"), ("path", "/" + sys.argv[2])]):
                  break
          else:
              sys.exit("The APK has no Microsoft login callback matching its signing certificate")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FoxTODO-android-arm64-signed
          path: FoxTODO-android-arm64-release.apk
          if-no-files-found: error

  nightly:
    name: Publish nightly release
    needs: [desktop, sign-android]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-nightly
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: 'FoxTODO-{windows-x64,macos-arm64,android-arm64-signed}'
          path: packages
      - name: Publish installers to nightly-builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-nightly.sh
